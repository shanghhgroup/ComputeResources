title: "ShangGroup 计算资源使用手册"
subtitle: "HFNL 2 节点 CPU · YangGroup 共享资源"
email:
description: >-
  ShangGroup 计算资源总览：本组 HFNL 2 节点 CPU 服务器、上级实验室 YangGroup 的 CPU 集群与 V100 GPU 服务器，以及账号申请和使用手册。

minimal_mistakes_skin: default
search: true

markdown: kramdown
remote_theme: "mmistakes/minimal-mistakes@4.28.0"

# 当前压缩包按 GitHub 项目仓库 ComputeResources 配置。
# 如果你的仓库名改为 username.github.io，请把 baseurl 改成空字符串：baseurl: ""
url: "https://shanghhgroup.github.io"
baseurl: "/ComputeResources"

permalink: /:categories/:title/

lang: zh-CN
locale: "zh_CN"
timezone: "Asia/Shanghai"
date_format: "%Y年%m月%d日"

include:
  - _pages

plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-remote-theme

atom_feed:
  hide: true

author:
  name: "ShangGroup"
  avatar: "/assets/images/lab_logo.png"
  bio: "YangGroup 下属实验室\n计算资源与使用手册"
  links:
    - label: "计算资源主页"
      icon: "fa-solid fa-server"
      url: "/ComputeResources/"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: true
      toc: true
      toc_sticky: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
      toc: true
      toc_sticky: true

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

exclude:
  - README.md
  - PUBLIC_SANITIZATION_NOTE.md
  - REPO_URL_NOTE.md
  - STYLE_FIX_NOTE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
